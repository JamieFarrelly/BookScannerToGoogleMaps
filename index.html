<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>what3words Scanner</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:20px;background:#111;color:#fff}h1{margin:0 0 6px}p{color:#bbb}.card{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:16px;margin:16px 0}video{width:100%;min-height:260px;object-fit:cover;border-radius:12px;background:#000;display:block}button,input{width:100%;box-sizing:border-box;padding:14px 15px;margin-top:10px;border-radius:10px;border:1px solid #555;font-size:17px}button{cursor:pointer;border:0;background:#fff;color:#111;font-weight:700}button:disabled{opacity:.45}.status{min-height:24px}.result{font-size:18px;font-weight:700;text-align:center;padding:14px;background:#292929;border-radius:10px;word-break:break-word}.result button{font-size:15px}.error{color:#ff9b9b}.hint{font-size:14px}</style></head><body><h1>what3words Scanner</h1><p>Point your iPhone camera at addresses such as <b>///seated.remote.unwell;</b>. Scanning starts automatically.</p><div class="card"><video id="video" autoplay muted playsinline webkit-playsinline></video><button id="startBtn" type="button">📷 Open camera</button><button id="scanBtn" type="button" disabled>Scan camera</button><p id="status" class="status">Camera is off.</p><label for="words">Detected / enter what3words address</label><input id="words" placeholder="///seated.remote.unwell;" autocomplete="off" spellcheck="false"><button id="openBtn" type="button" disabled>Open in Google Maps</button></div><div class="card"><div class="result" id="result">No address yet</div><p class="hint">The camera is scanned automatically. If more than one what3words address is visible, each one gets its own Google Maps button.</p></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>(function(){'use strict';const video=document.getElementById('video'),startBtn=document.getElementById('startBtn'),openBtn=document.getElementById('openBtn'),input=document.getElementById('words'),result=document.getElementById('result'),status=document.getElementById('status');function setStatus(m,e){status.textContent=m;status.className=e?'status error':'status'}function normalise(t){t=(t||'').toLowerCase().replace(/[’'`]/g,'').replace(/[|]/g,'i').replace(/[^a-z.;\s/_-]/g,' ').replace(/\s+/g,' ').trim();let m=t.match(/(?:\/\s*\/\s*\/\s*)?([a-z-]+)\s*\.\s*([a-z-]+)\s*\.\s*([a-z-]+)(?:\s*;)?/i);return m?'///'+m[1]+'.'+m[2]+'.'+m[3]:null}startBtn.addEventListener('click',async function(){if(!window.isSecureContext){setStatus('Camera requires the HTTPS GitHub Pages address.',true);return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Open this page directly in Safari or Chrome.',true);return}startBtn.disabled=true;setStatus('Requesting camera permission…');try{const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();startBtn.textContent='✓ Camera open';setStatus('Scanning automatically…')}catch(err){startBtn.disabled=false;if(err.name==='NotAllowedError')setStatus('Camera permission was denied. Go to Settings → Safari → Camera and allow access, then reload.',true);else setStatus('Could not open the camera ('+(err.name||'unknown')+').',true)}});input.addEventListener('input',function(){const a=normalise(input.value);if(a){input.value=a+';';result.textContent=a+';';openBtn.disabled=false}else{openBtn.disabled=true}});openBtn.addEventListener('click',function(){const a=normalise(input.value);if(a)window.location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)});})();</script><script src="scanner.js"></script></body></html>
