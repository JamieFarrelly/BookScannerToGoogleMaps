<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Business Scanner</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f4;color:#171717}main{max-width:760px;margin:0 auto;padding:18px 16px 30px}h1{font-size:28px;margin:4px 0 6px}.sub{margin:0 0 16px;color:#666}.camera{position:relative;background:#111;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #0002}video{width:100%;height:min(68vh,600px);min-height:360px;display:block;object-fit:cover}.scanline{position:absolute;left:9%;right:9%;top:42%;height:2px;background:#20c96b;box-shadow:0 0 12px #20c96b}.scanhint{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:18px;background:#000b;color:#fff;font-size:14px;white-space:nowrap}.live{position:absolute;right:14px;top:14px;padding:8px 11px;border-radius:18px;background:#111c;color:#fff;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#20c96b;margin-right:6px}.open{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;background:#171717;color:#fff;font-size:17px;font-weight:700}.panel{margin-top:14px;background:#202020;border-radius:22px 22px 0 0;padding:15px 12px 18px;color:#fff}.found{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 12px;font-size:18px;font-weight:700}.rescan{border:1px solid #777;background:transparent;color:#fff;border-radius:20px;padding:8px 13px;font-size:14px}.card{background:#fff;color:#171717;border-radius:16px;padding:13px;margin-top:9px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px #0002}.cardtext{flex:1;min-width:0}.name{font-size:19px;font-weight:750;line-height:1.2}.place{color:#666;margin-top:5px}.actions{display:flex;gap:7px;flex:0 0 250px}.maps,.directions{flex:1;border:0;border-radius:12px;color:#fff;padding:12px 8px;font-size:14px;font-weight:700}.maps{background:#1677ff}.directions{background:#20a464}.manual{background:#fff;border-radius:0 0 16px 16px;padding:16px 14px}.manual label{display:block;color:#666;margin-bottom:7px}.manualrow{display:flex;gap:8px}.manual input{flex:1;min-width:0;padding:13px;border:1px solid #ccc;border-radius:11px;font-size:16px}.manual button{border:0;border-radius:11px;padding:0 16px;background:#171717;color:#fff;font-weight:700}.destination{background:#fff;padding:16px 14px;border-top:1px solid #ddd}.destination label{display:block;font-weight:700;margin-bottom:7px}.destination input{width:100%;padding:13px;border:1px solid #ccc;border-radius:11px;font-size:16px}.status{padding:12px 4px 0;color:#aaa;font-size:14px}@media(max-width:520px){.actions{flex-basis:170px;gap:5px}.maps,.directions{font-size:12px;padding:11px 5px}.name{font-size:17px}video{min-height:320px}}</style></head><body><main><h1>Business Scanner</h1><p class="sub">Point your camera at a guide page. The business name directly above “Map 1”, “Map 2”, etc. is detected automatically.</p><div class="camera"><video id="video" autoplay muted playsinline webkit-playsinline></video><div class="scanhint">Centre the map listings in the camera</div><div class="live"><span class="dot"></span>Live scanning</div><div class="scanline"></div></div><button id="startBtn" class="open" type="button">📷 Open camera</button><div class="panel"><div class="found"><span id="foundCount">Found 0 businesses</span><button id="rescan" class="rescan" type="button">↻ Rescan</button></div><div id="results"></div><div class="status" id="status">Camera is off.</div></div><div class="destination"><label for="destination">Where do you want to go?</label><input id="destination" placeholder="Enter a destination, e.g. Rossio Square, Lisbon" autocomplete="street-address"></div><div class="manual"><label for="manualName">Or enter a business name manually</label><div class="manualrow"><input id="manualName" placeholder="e.g. Pastelaria Doce Mila" autocomplete="off"><button id="manualBtn" type="button">Search</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>(function(){'use strict';const video=document.getElementById('video'),startBtn=document.getElementById('startBtn'),rescanBtn=document.getElementById('rescan'),results=document.getElementById('results'),foundCount=document.getElementById('foundCount'),status=document.getElementById('status'),manualName=document.getElementById('manualName'),manualBtn=document.getElementById('manualBtn'),destination=document.getElementById('destination');let worker=null,busy=false,timer=null,lastKey='';const bad=/^(map|address|phone|tel|telephone|the|best|move|like|with|and|or|on|in|of|a|an|page|lisbon)$/i;function clean(s){return s.replace(/\s+/g,' ').replace(/^[-–—•·\s]+|[-–—•·\s]+$/g,'').trim()}function extractBusinesses(text){const lines=(text||'').split(/\r?\n/).map(clean).filter(Boolean),out=[];for(let i=1;i<lines.length;i++){if(/\bmap\s*\d+\s*[:;]?/i.test(lines[i])){let candidate=clean(lines[i-1]).replace(/\s*[:;,.]+$/,'').replace(/^[-–—•·]+/,'').trim(),words=candidate.split(/\s+/);if(candidate.length>=3&&candidate.length<=55&&words.length<=8&&!bad.test(candidate)&&!/[.!?]$/.test(candidate)){const key=candidate.toLowerCase();if(!out.some(x=>x.toLowerCase()===key))out.push(candidate)}}}return out}function mapsUrl(name){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+', Lisbon')}function directionsUrl(name){const to=destination.value.trim();if(!to){alert('Enter a destination first.');destination.focus();return null}return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(name+', Lisbon')+'&destination='+encodeURIComponent(to+', Lisbon')+'&travelmode=driving'}function render(names){results.innerHTML='';names.forEach(name=>{const card=document.createElement('div');card.className='card';const t=document.createElement('div');t.className='cardtext';const n=document.createElement('div');n.className='name';n.textContent=name;const p=document.createElement('div');p.className='place';p.textContent='📍 Lisbon';t.append(n,p);const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.className='maps';b.type='button';b.textContent='Open in Google Maps';b.onclick=()=>window.location.href=mapsUrl(name);const d=document.createElement('button');d.className='directions';d.type='button';d.textContent='Directions';d.onclick=()=>{const u=directionsUrl(name);if(u)window.location.href=u};actions.append(b,d);card.append(t,actions);results.append(card)});foundCount.textContent='Found '+names.length+' business'+(names.length===1?'':'es');if(names.length)status.textContent='Business names found automatically from the map listings.'}function frame(){const w=video.videoWidth,h=video.videoHeight,c=document.createElement('canvas'),scale=2;c.width=w*scale;c.height=h*scale;const x=c.getContext('2d');x.drawImage(video,0,0,c.width,c.height);return c}async function scan(){if(busy||!worker||!video.videoWidth)return;busy=true;try{const r=await worker.recognize(frame()),names=extractBusinesses(r.data.text);if(names.length){const key=names.join('|').toLowerCase();if(key!==lastKey){lastKey=key;render(names)}}else if(!lastKey)status.textContent='Looking for business names above Map 1, Map 2, etc.…'}catch(e){console.error(e)}finally{busy=false}}async function startOCR(){if(worker)return;try{status.textContent='Loading scanner…';worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});status.textContent='Scanning automatically…';scan();timer=setInterval(scan,1800)}catch(e){console.error(e);status.textContent='Could not load the text scanner.'}}startBtn.addEventListener('click',async()=>{if(!window.isSecureContext){status.textContent='Camera requires the HTTPS GitHub Pages address.';return}try{startBtn.disabled=true;status.textContent='Requesting camera permission…';const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();startBtn.textContent='✓ Camera open';startOCR()}catch(e){startBtn.disabled=false;status.textContent=e.name==='NotAllowedError'?'Camera permission was denied. Allow camera access in Safari settings, then reload.':'Could not open the camera.'}});rescanBtn.addEventListener('click',()=>{lastKey='';results.innerHTML='';foundCount.textContent='Found 0 businesses';status.textContent='Scanning again…';scan()});manualBtn.addEventListener('click',()=>{const n=clean(manualName.value);if(n)render([n])});manualName.addEventListener('keydown',e=>{if(e.key==='Enter')manualBtn.click()})})();</script></body></html>
